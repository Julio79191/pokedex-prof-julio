<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WitAnimals - Pokédex da Mata</title>
<style>
body{margin:0;font-family:Arial;background:#06202a;color:white}
header{background:linear-gradient(135deg,#00a878,#087ca7);padding:35px;text-align:center}
.logo{font-size:80px}
nav{text-align:center;background:#03151c;padding:15px}
button{background:#22c55e;border:0;padding:12px 18px;border-radius:15px;cursor:pointer;font-weight:bold;margin:5px}
.tela{display:none;padding:25px}.ativa{display:block}
.caixa{background:#102d36;border-radius:25px;padding:25px;max-width:1100px;margin:auto}
.safari{height:350px;background:linear-gradient(#7dd3fc,#d6a04b);border-radius:25px;text-align:center;color:#17301c;padding:25px}
.bichos{font-size:70px;margin:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#09242c;border-radius:20px;padding:15px}
.info{background:#0b3540;padding:10px;border-radius:10px;margin:8px 0}
.perigo{background:#991b1b;padding:10px;border-radius:10px}
.logo img{width:80px;height:80px;object-fit:contain}
.emoji-img{height:1em;width:auto;vertical-align:-0.15em}
.bichos img{height:70px;width:auto;vertical-align:middle}
</style>
</head>
<body>

<header>
<div class="logo"><img src="/grupos/titto-m2-arthur/img/capivara.png" alt="Capivara"></div>
<h1>WitAnimals</h1>
<p>🌿 Pokédex da Mata</p>
<p>🔬 Explore animais como um cientista!</p>
</header>

<nav>
<button onclick="abrir('inicio')">🏠 Início</button>
<button onclick="abrir('safari')">🌅 Safári</button>
<button onclick="abrir('pokedex')">🐾 Pokédex</button>
</nav>

<section id="inicio" class="tela ativa">
<div class="caixa">
<h2>Bem-vindo ao WitAnimals!</h2>
<p>Descubra mamíferos, curiosidades, habitats e sons.</p>
<button onclick="abrir('safari')">🚀 Começar aventura</button>
</div>
</section>

<section id="safari" class="tela">
<div class="caixa">
<div class="safari">
<h1>🌅 Safári da Mata</h1>
<p>Encontre animais escondidos!</p>
<div class="bichos"><img src="/grupos/titto-m2-arthur/img/capivara.png" alt="Capivara"> 🐆 🦁 🐘 🦒</div>
<button onclick="abrir('pokedex')">Abrir Pokédex</button>
</div>
</div>
</section>

<section id="pokedex" class="tela">
<div class="caixa">
<h2>🐾 Fichas dos animais</h2>
<div class="grid" id="lista"></div>
</div>
</section>

<script>
const animais=[
['<img class="emoji-img" src="/grupos/titto-m2-arthur/img/capivara.png" alt=""> Capivara',"Vive perto de rios","Plantas e capim","Maior roedor do mundo","Assobio"],
["🦁 Leão","Savanas africanas","Carne","Vive em grupos","Rugido"],
["🐘 Elefante","África e Ásia","Folhas e frutas","Usa a tromba para beber água","Trombeta"],
["🐺 Lobo","Florestas e montanhas","Carne","Se comunica por uivos","Uivo"],
["🐯 Tigre","Florestas da Ásia","Carne","Grande felino","Rugido"]
];

const lista=document.getElementById("lista");

animais.forEach((a,i)=>{
lista.innerHTML+=`
<div class="card">
<h2>${a[0]}</h2>
<div class="info">🌎 Habitat: ${a[1]}</div>
<div class="info">🍎 Alimentação: ${a[2]}</div>
<div class="info">💡 Curiosidade: ${a[3]}</div>
<div class="info">🔊 Som: ${a[4]}</div>
<button onclick="som('${i}')">▶ Ouvir som do animal</button>
${i>0?'<div class="perigo">⚠️ Atenção: animal que pode ser perigoso</div>':''}
</div>`;
});

const SONS = [
  "sons/capivara.mp3",
  "sons/leao.mp3",
  "sons/elefante.mp3",
  "sons/lobo.mp3",
  "sons/tigre.mp3"
];

const PASTA = "/grupos/titto-m2-arthur/";
let somAtual = null;

function som(i){
  if (somAtual) { somAtual.pause(); somAtual.currentTime = 0; } // para o anterior
  somAtual = new Audio(PASTA + SONS[i]);
  somAtual.onerror = () => alert("🔇 Não encontrei o som desse animal ainda.");
  somAtual.play().catch(() => {});
}

function abrir(id){
document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
document.getElementById(id).classList.add('ativa');
window.scrollTo(0,0);
}
</script>
<!--
  COLE ESTE BLOCO NO FINAL DO index.html DO GRUPO, logo ANTES do </body>.
  Ele liga o front do grupo ao back-end e à ficha padrão em pop-up.

  O que trocar:
    - icone, cor e cor2: o emoji e as duas cores principais do front do grupo;
    - escuro: () => true se o front é escuro, () => false se é claro;
    - noturno / claro: as cores da ficha (fundo, texto e texto mais apagado);
    - carregando: a frase de "procurando" do próprio grupo;
    - esconder: o resultado ANTIGO do front (para não aparecer duas vezes);
    - salvar: o que acontece no botão "💾 Salvar no álbum" (clicar no botão de
      salvar do grupo e abrir a aba do álbum). Se o front não tem álbum, apague;
    - novaFoto: o que acontece no botão "🔍 Reconhecer outra".
  Tudo que você não souber, pode apagar: só o icone e as cores são importantes.
-->
<script src="/comum/ficha.js"></script>
<script src="/comum/adaptador.js"></script>
<script>
PokedexAdaptador.iniciar({
  icone: "🐀", fauna: true,                 // fauna: true para animais
  cor: "#06202a",
  escuro: () => true,
  carregando: "🔎 Procurando pistas na foto...",
  // Campos que o front do grupo pede à IA e que você quer mostrar na ficha:
  extras: info => [["🌿 Onde vive", info.habitat]],
  // Aviso vermelho na ficha (ex.: planta venenosa):
  alerta: info => info.perigoso === true ? (info.aviso || "Cuidado! Peça ajuda a um adulto.") : "",
  salvar: () => { document.getElementById("saveBtn").click(); document.getElementById("abaAlbum").click(); },
  novaFoto: () => document.getElementById("fotoInput").click()
});
</script>
</body>
</html>
